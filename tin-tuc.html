<!DOCTYPE html>
<!--
  =========================================================
  TRANG TIN TỨC & CẨM NANG - tin-tuc.html
  Người phụ trách: THÀNH VIÊN 2
  File liên quan: css/trang-con.css, css/tin-tuc.css, js/tin-tuc.js
  Link tin-tuc.html?loai=tin-y-te hoặc ?loai=cam-nang -> mở sẵn đúng chuyên mục
  =========================================================
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin tức &amp; cẩm nang sức khỏe - HomeCare</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS chung (Thành viên 1) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <!-- CSS của trang (Thành viên 2) -->
  <link rel="stylesheet" href="css/trang-con.css">
  <link rel="stylesheet" href="css/tin-tuc.css">
</head>

<body data-page="tin-tuc">

  <!-- HEADER: được chèn tự động bởi js/layout.js -->
  <div id="site-header"></div>

  <main>

    <!-- ===================== BANNER ===================== -->
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb">
          <a href="index.html">Trang chủ</a>
          <i class="fa-solid fa-chevron-right"></i>
          <span>Tin tức</span>
        </nav>
        <h1>Tin tức &amp; cẩm nang sức khỏe</h1>
        <p>Kiến thức chăm sóc sức khỏe tại nhà do đội ngũ bác sĩ HomeCare biên soạn, cập nhật mỗi tuần.</p>
      </div>
    </section>


    <section class="page-section">
      <div class="container">

        <!-- ===================== THANH LỌC ===================== -->
        <div class="news-toolbar">
          <div class="news-tabs" id="news-tabs">
            <button type="button" class="news-tab active" data-category="tat-ca">Tất cả</button>
            <button type="button" class="news-tab" data-category="tin-y-te">Tin y tế</button>
            <button type="button" class="news-tab" data-category="cam-nang">Cẩm nang sức khỏe</button>
          </div>

          <label class="news-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="news-search" placeholder="Tìm bài viết...">
          </label>
        </div>

        <p class="news-count" id="news-count"></p>

        <!-- JS tạo các thẻ bài viết và đặt vào đây -->
        <div class="news-grid" id="news-grid"></div>
      </div>
    </section>


    <!-- ===================== ĐĂNG KÝ NHẬN BẢN TIN ===================== -->
    <section class="page-section alt">
      <div class="container">
        <div class="newsletter">
          <div>
            <h2>Nhận cẩm nang sức khỏe mỗi tuần</h2>
            <p>Mỗi thứ Hai, HomeCare gửi 1 email ngắn gồm các bài viết hữu ích nhất. Hủy bất cứ lúc nào.</p>
          </div>
          <form class="newsletter-form" id="newsletter-form" novalidate>
            <input type="email" id="newsletter-email" class="form-control" placeholder="Nhập email của bạn">
            <button type="submit" class="btn btn-primary">Đăng ký</button>
          </form>
          <p class="newsletter-message" id="newsletter-message"></p>
        </div>
      </div>
    </section>

  </main>


  <!-- ===================== HỘP ĐỌC BÀI =====================
       <dialog>: thẻ hộp thoại có sẵn của HTML.
       JS gọi showModal() để mở (nền phía sau tự mờ), close() để đóng.
       Nhấn phím Esc cũng tự đóng. -->
  <dialog class="article-dialog" id="article-dialog">
    <button type="button" class="dialog-close" id="dialog-close" aria-label="Đóng">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div id="dialog-content"></div>
  </dialog>

  <!-- FOOTER: được chèn tự động bởi js/layout.js -->
  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/tin-tuc.js"></script>
</body>
</html>
